spring.application.name=borrowdesk
server.port=8081

# File-based H2. Directory comes from BORROWDESK_DATA_DIR (default: ~/.borrowdesk/data, outside target/).
spring.datasource.url=jdbc:h2:file:${BORROWDESK_DATA_DIR:${user.home}/.borrowdesk/data}/borrowdesk
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=never
