<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Active Loans')}"></head>
<body>
<header th:replace="~{fragments :: nav('loans')}"></header>

<main class="container">
  <h1>My Active Loans</h1>
  <p class="subtitle">Equipment items currently checked out to your register number</p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Loan ID</th>
          <th>Equipment Item</th>
          <th>Issued Date</th>
          <th>Due Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="l : ${loans}">
          <td th:text="'#' + ${l.id}">#1</td>
          <td><strong th:text="${l.equipment.name}">Projector</strong></td>
          <td th:text="${l.issuedDate}">2026-01-01</td>
          <td th:text="${l.dueDate}">2026-01-05</td>
          <td>
            <span class="badge badge-out" th:if="${l.dueDate.isBefore(today)}">Overdue</span>
            <span class="badge badge-ok" th:unless="${l.dueDate.isBefore(today)}">Active</span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(loans)}">
          <td colspan="5" class="empty">You have no active loans right now.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
