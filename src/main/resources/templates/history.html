<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('History')}"></head>
<body>
<header th:replace="~{fragments :: nav('history')}"></header>
<main class="container">
  <h1>Loan history</h1>
  <p class="muted">Most recent 50 loans.</p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Equipment</th><th>Student</th><th>Register no.</th><th>Issued</th><th>Due</th><th>Returned</th></tr>
      </thead>
      <tbody>
        <tr th:each="l : ${loans}">
          <td th:text="${l.equipment.name}">Projector</td>
          <td th:text="${l.studentName}">Name</td>
          <td th:text="${l.registerNumber}">REG</td>
          <td th:text="${l.issuedDate}">2026-01-01</td>
          <td th:text="${l.dueDate}">2026-01-02</td>
          <td>
            <span th:if="${l.returnedDate != null}" th:text="${l.returnedDate}">2026-01-02</span>
            <span class="badge badge-ok" th:if="${l.returnedDate == null}">Out</span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(loans)}"><td colspan="6" class="empty">No loans yet.</td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
